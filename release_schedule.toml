# 解答釋出時間表
# 網站建置腳本(scripts/build_docs.py)只會在「日期已到」時,才把解答放進課程網站。
# 每天由 deploy-site 工作流程自動重新建置,因此到期後無需手動操作。
#
# 重要:這只控制「課程網站」。若 Repo 為公開,solution/ 資料夾本身仍可被看到!
#       需要保密請把 solution/ 移到私有 Repo(見 SETUP.md「解答保密」)。

timezone = "Asia/Taipei"

[solutions]
# 實驗代號 = 釋出日期(當天 00:00 起生效)。未列出者永不釋出。
lab01 = 2099-12-31 # TODO: 改成實際日期,例如 2026-10-31
lab02 = 2099-12-31 # TODO
lab03 = 2099-12-31 # TODO
