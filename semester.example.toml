# 新學期設定檔範例:複製為 semester.toml 後填寫,再執行 scripts/new_semester.py
# 字串用雙引號;日期直接寫 YYYY-MM-DD(不加引號)。

# ---- 必填 ----
course_name = "深度學習導論"
course_code = "CSIE0000"
