# 確認每一本 Notebook 都能在乾淨環境「全部執行」成功
name: notebook-check

on:
  push:
    paths:
      - "notebooks/**"
      - "requirements*.txt"
      - ".github/workflows/notebook-check.yml"
  pull_request:
    paths:
      - "notebooks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg # 無顯示環境下 matplotlib 不開視窗
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 逐本執行 Notebook
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(notebooks/*.ipynb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "沒有 Notebook,略過"; exit 0
          fi
          for nb in "${files[@]}"; do
            echo "::group::執行 $nb"
            # 輸出到暫存目錄,不修改 Repo 內的原檔
            jupyter nbconvert --to notebook --execute "$nb" \
              --output-dir "$RUNNER_TEMP/executed" \
              --ExecutePreprocessor.timeout=600
            echo "::endgroup::"
          done
