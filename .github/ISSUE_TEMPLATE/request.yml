name: 📝 申請(請假 / 補交 / 其他)
description: 一般性申請。個資與成績相關請改用 Email。
title: "[申請] "
labels: ["request"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **此為公開 Issue。請勿填寫學號、身分證號、病假證明等個資。**
        教師會以 Email 或校內系統回覆細節。
  - type: dropdown
    id: type
    attributes:
      label: 申請類型
      options:
        - 作業延期
        - 補交
        - 請假(僅說明日期,不需附證明於此)
        - 其他
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: 相關項目
      description: 例如 HW 01、Lab 02、期中考
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 簡要說明(勿含敏感個資)
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 確認
      options:
        - label: 我了解此 Issue 為公開,且未填寫個資
          required: true
