<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360"><rect width="1280" height="360" fill="white"/><defs><marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#275f79"/></marker></defs><rect x="60" y="50" width="560" height="260" rx="16" fill="#edf3f7" stroke="#275f79" stroke-width="3"/><text x="84" y="102" font-family="Arial" font-size="30" font-weight="700" fill="#132634">Classification</text><text x="84" y="164" font-family="Arial" font-size="26" font-weight="400" fill="#132634">Which category?</text><text x="84" y="212" font-family="Arial" font-size="26" font-weight="400" fill="#132634">A finite class identifier</text><text x="84" y="260" font-family="Arial" font-size="26" font-weight="400" fill="#132634">Example: apple or cucumber</text><rect x="660" y="50" width="560" height="260" rx="16" fill="#edf3f7" stroke="#275f79" stroke-width="3"/><text x="684" y="102" font-family="Arial" font-size="30" font-weight="700" fill="#132634">Regression</text><text x="684" y="164" font-family="Arial" font-size="26" font-weight="400" fill="#132634">What diameter?</text><text x="684" y="212" font-family="Arial" font-size="26" font-weight="400" fill="#132634">A real-valued measurement</text><text x="684" y="260" font-family="Arial" font-size="26" font-weight="400" fill="#132634">Example: 7.2 cm</text></svg>