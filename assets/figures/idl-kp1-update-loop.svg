<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="idl-kp1-update-loop-title idl-kp1-update-loop-desc" id="idl-kp1-update-loop-root"><title id="idl-kp1-update-loop-title">訓練是反覆的參數搜尋 Training as parameter search</title><desc id="idl-kp1-update-loop-desc">Loop diagram: predict with parameters, compute the loss, take the gradient, choose a step and update the parameters, writing every result into a shared training state.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #idl-kp1-update-loop-root { color: #f2ede4; }
      #idl-kp1-update-loop-root .diagram-container { width: 100%; overflow-x: auto; }
      #idl-kp1-update-loop-root .diagram-container { overflow-x: visible; }</style><marker id="idl-kp1-update-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b7b0a5"/></marker><marker id="idl-kp1-update-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d97757"/></marker><marker id="idl-kp1-update-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a9fd6"/></marker><marker id="idl-kp1-update-loop-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a39d92"/></marker></defs><rect width="100%" height="100%" fill="#151513"/><text x="40" y="84" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="40" font-weight="600" fill="#f2ede4" text-anchor="start">訓練就是反覆搜尋參數：預測、打分、求梯度、更新</text><text x="40" y="112" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="500" fill="#b7b0a5" text-anchor="start">Training is a repeated parameter search: predict, score, differentiate, update</text><line x1="40" y1="128" x2="1240" y2="128" stroke="#b7b0a5" stroke-opacity="0.32" stroke-width="1"/><path d="M729.939 212.896 A204 204 0 0 1 815.386 291.809" fill="none" stroke="#b7b0a5" stroke-width="1.4" marker-end="url(#idl-kp1-update-loop-arrow)"/><path d="M842.689 372.907 A204 204 0 0 1 802.003 519.980" fill="none" stroke="#b7b0a5" stroke-width="1.4" marker-end="url(#idl-kp1-update-loop-arrow)"/><path d="M669.942 597.791 A204 204 0 0 1 611.444 597.991" fill="none" stroke="#b7b0a5" stroke-width="1.4" marker-end="url(#idl-kp1-update-loop-arrow)"/><path d="M478.852 521.089 A204 204 0 0 1 437.158 374.298" fill="none" stroke="#b7b0a5" stroke-width="1.4" marker-end="url(#idl-kp1-update-loop-arrow)"/><path d="M463.903 293.015 A204 204 0 0 1 548.806 213.518" fill="none" stroke="#b7b0a5" stroke-width="1.4" marker-end="url(#idl-kp1-update-loop-arrow)"/><line x1="640.00" y1="232.00" x2="640.00" y2="354.00" stroke="#a39d92" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#idl-kp1-update-loop-arrow-soft)"/><line x1="744.02" y1="362.20" x2="705.71" y2="374.65" stroke="#a39d92" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#idl-kp1-update-loop-arrow-soft)"/><line x1="730.85" y1="521.04" x2="669.68" y2="436.85" stroke="#a39d92" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#idl-kp1-update-loop-arrow-soft)"/><line x1="549.15" y1="521.04" x2="610.32" y2="436.85" stroke="#a39d92" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#idl-kp1-update-loop-arrow-soft)"/><line x1="535.98" y1="362.20" x2="574.29" y2="374.65" stroke="#a39d92" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#idl-kp1-update-loop-arrow-soft)"/><rect x="550" y="152" width="180" height="80" rx="6" fill="#151513"/><rect x="550" y="152" width="180" height="80" rx="6" fill="#151513" stroke="#f2ede4" stroke-width="1"/><rect x="562" y="160" width="60" height="16" rx="2" fill="none" stroke="#b7b0a5" stroke-width="0.8" stroke-opacity="0.6"/><text x="592" y="172" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="500" fill="#b7b0a5" text-anchor="middle">假設類別</text><text x="562" y="198" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">預測 Predict</text><text x="562" y="218" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">ŷ = f(x; θ)</text><rect x="744" y="293" width="180" height="80" rx="6" fill="#151513"/><rect x="744" y="293" width="180" height="80" rx="6" fill="#d97757" fill-opacity="0.12" stroke="#d97757" stroke-width="1.4"/><rect x="756" y="301" width="36" height="16" rx="2" fill="none" stroke="#d97757" stroke-width="0.8" stroke-opacity="0.6"/><text x="774" y="313" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="500" fill="#d97757" text-anchor="middle">損失</text><text x="756" y="339" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">損失 Loss</text><text x="756" y="359" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">L = loss(ŷ, y)</text><rect x="669.9" y="521" width="180" height="80" rx="6" fill="#151513"/><rect x="669.9" y="521" width="180" height="80" rx="6" fill="#151513" stroke="#f2ede4" stroke-width="1"/><rect x="681.9" y="529" width="48" height="16" rx="2" fill="none" stroke="#b7b0a5" stroke-width="0.8" stroke-opacity="0.6"/><text x="705.9" y="541" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="500" fill="#b7b0a5" text-anchor="middle">優化器</text><text x="681.9" y="567" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">梯度 Gradient</text><text x="681.9" y="587" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">g = ∇L(θ)</text><rect x="430.1" y="521" width="180" height="80" rx="6" fill="#151513"/><rect x="430.1" y="521" width="180" height="80" rx="6" fill="#151513" stroke="#f2ede4" stroke-width="1"/><rect x="442.1" y="529" width="48" height="16" rx="2" fill="none" stroke="#b7b0a5" stroke-width="0.8" stroke-opacity="0.6"/><text x="466.1" y="541" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="500" fill="#b7b0a5" text-anchor="middle">優化器</text><text x="442.1" y="567" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">步長 Step</text><text x="442.1" y="587" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">d = −η · g</text><rect x="356" y="293" width="180" height="80" rx="6" fill="#151513"/><rect x="356" y="293" width="180" height="80" rx="6" fill="#151513" stroke="#f2ede4" stroke-width="1"/><rect x="368" y="301" width="48" height="16" rx="2" fill="none" stroke="#b7b0a5" stroke-width="0.8" stroke-opacity="0.6"/><text x="392" y="313" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="500" fill="#b7b0a5" text-anchor="middle">優化器</text><text x="368" y="339" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">更新 Update</text><text x="368" y="359" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">θ ← θ + d</text><rect x="580" y="360" width="120" height="72" rx="6" fill="#151513"/><rect x="580" y="360" width="120" height="72" rx="6" fill="#f2ede4" stroke="#f2ede4" stroke-width="1"/><text x="640" y="392" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#151513" text-anchor="middle">狀態 State</text><text x="640" y="414" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" fill="#151513" text-anchor="middle" fill-opacity="0.8">θ, L, g</text><text x="40" y="160" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">一圈只做一件事</text><text x="40" y="180" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">One pass does one thing</text><text x="40" y="212" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">用目前的參數 θ 預測，</text><text x="40" y="234" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">量出錯得多嚴重，找出</text><text x="40" y="256" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">往哪走會更好，走一小步，</text><text x="40" y="278" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">再把新的 θ 帶回下一圈。</text><text x="40" y="312" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">Predict with the current θ, measure how</text><text x="40" y="329" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">wrong it is, find a better direction, take</text><text x="40" y="346" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">a small step, and carry the new θ into</text><text x="40" y="363" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">the next pass.</text><line x1="40" y1="400" x2="320" y2="400" stroke="#f2ede4" stroke-opacity="0.14" stroke-width="1"/><text x="40" y="428" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">三個角色</text><text x="40" y="448" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">Three roles</text><text x="40" y="480" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">假設類別　模型能表示什麼</text><text x="40" y="498" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">Hypothesis class: what it can represent</text><text x="40" y="530" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">損失　替每組參數打分</text><text x="40" y="548" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">Loss: scores every choice of parameters</text><text x="40" y="580" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">優化器　決定怎麼走</text><text x="40" y="598" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">Optimizer: decides how to move</text><text x="960" y="160" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">一次更新</text><text x="960" y="180" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">One update step</text><text x="960" y="212" font-family="'Geist Mono',ui-monospace,monospace" font-size="14" font-weight="500" fill="#f2ede4" text-anchor="start"><tspan font-size="14">θ ← θ − η ∇L(θ)</tspan></text><text x="960" y="244" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">沿損失下降最快的方向</text><text x="960" y="266" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">走一步，步長 η 叫</text><text x="960" y="288" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">學習率。</text><text x="960" y="312" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">Step along the steepest descent</text><text x="960" y="329" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">direction; η is the learning rate.</text><line x1="960" y1="360" x2="1240" y2="360" stroke="#f2ede4" stroke-opacity="0.14" stroke-width="1"/><text x="960" y="388" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">何時停？</text><text x="960" y="408" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">When to stop?</text><text x="960" y="440" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">達到收斂準則就停</text><text x="960" y="462" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">（KP3），否則再繞一圈。</text><text x="960" y="488" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">Stop when a convergence criterion</text><text x="960" y="505" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">holds (KP3); otherwise loop again.</text><line x1="40" y1="660" x2="1240" y2="660" stroke="#f2ede4" stroke-opacity="0.14" stroke-width="1"/><text x="40" y="684" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">實線＝一圈的順序；虛線＝每站把結果寫進中央的「狀態」；標籤＝該站屬於哪個角色。</text><text x="40" y="702" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="11" font-weight="400" fill="#a39d92" text-anchor="start">Solid arrows: order of one pass. Dashed: each station writes to the shared state. Tag: the station's role.</text><text x="1240" y="684" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="600" fill="#f2ede4" text-anchor="end">只用目前位置的斜率，看不到別的山谷；可能停在局部極小或鞍點。</text><text x="1240" y="702" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="11" font-weight="400" fill="#a39d92" text-anchor="end">It sees only the local slope, so it may stop at a local minimum or a saddle point.</text></svg>
