<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6a9fd6"/></marker></defs><rect width="1280" height="440" fill="white"/><g font-family="Arial" font-size="28" fill="#172a36"><rect x="60" y="120" width="360" height="180" rx="12" fill="#d97757" fill-opacity=".1" stroke="#d97757" stroke-width="3"/><text x="240.0" y="160" text-anchor="middle">Agent</text><text x="240.0" y="195" text-anchor="middle">state s → action a</text><rect x="860" y="120" width="360" height="180" rx="12" fill="#6a9fd6" fill-opacity=".1" stroke="#6a9fd6" stroke-width="3"/><text x="1040.0" y="160" text-anchor="middle">Environment</text><text x="1040.0" y="195" text-anchor="middle">next state s' and reward r</text><path d="M420 160L860 160" fill="none" stroke="#6a9fd6" stroke-width="4" marker-end="url(#arrow)"/><path d="M860 260L420 260" fill="none" stroke="#6a9fd6" stroke-width="4" marker-end="url(#arrow)"/><text x="640" y="139" text-anchor="middle">action a</text><text x="640" y="313" text-anchor="middle">next state s' / reward r</text><circle cx="570" cy="355" r="27" fill="#7dbb8c"/><text x="570" y="364" text-anchor="middle">+</text><circle cx="710" cy="355" r="27" fill="#e07a70"/><text x="710" y="364" text-anchor="middle">−</text><text x="640" y="414" text-anchor="middle">Repeat interaction; a single reward does not prove learning.</text></g></svg>