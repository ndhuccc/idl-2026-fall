" width="440" height="58" rx="6" fill="#151513"/><rect x="40" y="176" width="440" height="58" rx="6" fill="#151513" stroke="#f2ede4" stroke-width="1"/><text x="56" y="200" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">問題 Problem</text><text x="56" y="222" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">最小化 L(θ)，θ 有 d 個參數</text><text x="464" y="200" font-family="'Geist Mono',ui-monospace,monospace" font-size="14" font-weight="500" fill="#b7b0a5" text-anchor="end">min L(θ)</text><line x1="145" y1="234" x2="145" y2="268" stroke="#d97757" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="40" y="274" width="210" height="150" rx="6" fill="#151513"/><rect x="40" y="274" width="210" height="150" rx="6" fill="rgba(217,119,87,0.12)" stroke="#d97757" stroke-width="1.4"/><text x="54" y="302" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">一階 First-order</text><text x="54" y="332" font-family="'Geist Mono',ui-monospace,monospace" font-size="14" font-weight="500" fill="#f2ede4" text-anchor="start">θ ← θ − η g</text><text x="54" y="366" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">只算梯度 g</text><text x="54" y="390" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">記憶體 O(d)</text><text x="54" y="412" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">First-order</text><line x1="145" y1="424" x2="145" y2="462" stroke="#d97757" stroke-width="1.4" marker-end="url(#arrow-accent)"/><line x1="375" y1="234" x2="375" y2="268" stroke="#b7b0a5" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="270" y="274" width="210" height="150" rx="6" fill="#151513"/><rect x="270" y="274" width="210" height="150" rx="6" fill="#151513" stroke="#f2ede4" stroke-width="1"/><text x="284" y="302" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">二階 Second-order</text><text x="284" y="332" font-family="'Geist Mono',ui-monospace,monospace" font-size="14" font-weight="500" fill="#f2ede4" text-anchor="start">θ ← θ − H⁻¹ g</text><text x="284" y="366" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">還要 Hessian H</text><text x="284" y="390" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">記憶體 O(d²)</text><text x="284" y="412" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">Needs the Hessian</text><line x1="375" y1="424" x2="375" y2="462" stroke="#b7b0a5" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="40" y="468" width="440" height="96" rx="6" fill="#151513"/><rect x="40" y="468" width="440" height="96" rx="6" fill="rgba(217,119,87,0.12)" stroke="#d97757" stroke-width="1.4"/><text x="56" y="498" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">深度學習用一階</text><text x="56" y="520" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">d 常達百萬以上，O(d²) 的記憶體放不下。</text><text x="56" y="546" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">At d ≥ 10⁶ the O(d²) Hessian does not fit in memory.</text><text x="40" y="592" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#f2ede4" text-anchor="start">代價：每步較「慢」，要靠步長 η 與調整技巧補。</text><text x="40" y="612" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">Price: more, slower steps — η and tricks make up for it.</text><line x1="494" y1="150" x2="494" y2="640" stroke="rgba(242,237,228,0.14)" stroke-width="1"/><text x="520" y="160" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="600" fill="#f2ede4" text-anchor="start">證據 1　同一個問題走兩種路</text><text x="520" y="178" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="400" fill="#b7b0a5" text-anchor="start">Evidence 1: two ways down the same bowl</text><clipPath id="plotclip"><rect x="520" y="190" width="340" height="170"/></clipPath><rect x="520" y="190" width="340" height="170" fill="#1f1f1c" stroke="rgba(183,176,165,0.32)" stroke-width="1"/><ellipse cx="548.3" cy="275" rx="400.7" ry="92.5" fill="none" stroke="#b7b0a5" stroke-opacity="0.45" stroke-width="1" clip-path="url(#plotclip)"/><ellipse cx="548.3" cy="275" rx="310.4" ry="71.6" fill="none" stroke="#b7b0a5" stroke-opacity="0.45" stroke-width="1" clip-path="url(#plotclip)"/><ellipse cx="548.3" cy="275" rx="219.5" ry="50.6" fill="none" stroke="#b7b0a5" stroke-opacity="0.45" stroke-width="1" clip-path="url(#plotclip)"/><ellipse cx="548.3" cy="275" rx="138.8" ry="32" fill="none" stroke="#b7b0a5" stroke-opacity="0.45" stroke-width="1" clip-path="url(#plotclip)"/><ellipse cx="548.3" cy="275" rx="80.1" ry="18.5" fill="none" stroke="#b7b0a5" stroke-opacity="0.45" stroke-width="1" clip-path="url(#plotclip)"/><po
