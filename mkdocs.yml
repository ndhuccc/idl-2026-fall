# 課程網站設定(MkDocs + Material)
# 注意:網站原始檔由 scripts/build_docs.py 產生於 .site_src/,請勿直接編輯該資料夾。
site_name: "深度學習導論 — 2026 秋季"
site_description: "深度學習導論 課程網站"
site_url: "https://ndhuccc.github.io/idl-2026-fall/"
repo_url: "https://github.com/ndhuccc/idl-2026-fall"
docs_dir: .site_src

theme:
  name: material
  language: custom
  custom_dir: overrides
  features:
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search

# LaTeX:搭配 .site_src/javascripts/mathjax.js
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# 連結問題僅提示、不中斷建置(README 內有 GitHub 網頁專用的相對連結)
validation:
  omitted_files: info
  absolute_links: info
  unrecognized_links: info
  anchors: info

# 暫不公開的草稿頁:HW 01 內容與日期定了之後,把 README.draft.md 改回 README.md,並刪除下面兩行
exclude_docs: |
  assignments/hw01/README.draft.md

# --- nav(由 build_docs.py 依 schedule.md 產生,請勿手改)---
nav:
  - 首頁 Home: index.md
  - 課程大綱 Syllabus: syllabus.md
  - 週次進度表 Schedule: schedule.md
  - 講義 Lectures:
      - 第 1 週 Week 1:
          - lec01: lectures/lec01.md
  - 作業 Assignments:
      - 作業繳交說明 Submission Guide: assignments/README.md
      - 請 AI agent 協助 AI Agent Prompt: assignments/ai-agent-prompt.md
  - 專題 Projects: projects/README.md
  - 考試與測驗 Exams & Quizzes: exams/README.md
  - Notebook: notebooks/README.md
  - 投影片下載 Slides: slides/README.md
  - 參考資料 References: references/README.md
  - 自學指引 Study Guide: study-guide/README.md
  - 常見問題 FAQ: FAQ.md
  - 術語表 Glossary: glossary.md
  - 異動紀錄 Changelog: CHANGELOG.md
  - 貢獻指南 Contributing: CONTRIBUTING.md
  - 授權 License: LICENSE.md
# --- nav 結束 ---
